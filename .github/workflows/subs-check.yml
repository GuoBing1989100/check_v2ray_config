name: Subscription Checker

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:        # 允许手动触发

jobs:
  check-subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p output

      # 👇 这里用最新版 latest，不写死版本
      - name: Run subs-check latest
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/config:/app/config \
            -v ${{ github.workspace }}/output:/app/output \
            ghcr.io/beck-8/subs-check:latest

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: SoliSpirit/v2ray-configs
          token: ${{ secrets.PAT_TOKEN }}
          path: target-repo

      - name: Copy and push results
        run: |
          cp -rf output/* target-repo/ || true
          cd target-repo
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update subscriptions" || exit 0
          git push
